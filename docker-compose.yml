version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quantum_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/quantum_studio
      SYNC_DATABASE_URL: postgresql://postgres:password@db:5432/quantum_studio
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production-minimum-32-chars}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:5174"
      APP_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Qiskit Metal Bridge ────────────────────────────────────────────────────
  # Provides /components, /design/render, /design/generate-code, /design/run-code
  # Required by the Schematic Editor for live component discovery and rendering.
  bridge:
    build:
      context: ./editor/backend
      dockerfile: Dockerfile
    environment:
      BRIDGE_HOST: "0.0.0.0"
      BRIDGE_PORT: "8000"
      BRIDGE_LOG_LEVEL: "info"
      QISKIT_METAL_HEADLESS: "1"
      MPLBACKEND: "Agg"
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_BACKEND_URL: http://localhost:5000
      VITE_BRIDGE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - bridge
    restart: unless-stopped

volumes:
  pg_data:
